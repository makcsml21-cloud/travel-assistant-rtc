<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Travel Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="number"], textarea {
      width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
    }
    button {
      padding: 12px 20px; background-color: #3498db; color: white; border: none;
      border-radius: 4px; cursor: pointer; font-size: 16px;
    }
    button:hover { background-color: #2980b9; }
    #assistant-response {
      margin-top: 25px; padding: 15px; background: #f9f9f9; border: 1px solid #ddd;
      border-radius: 6px; white-space: pre-wrap; /* сохраняет переносы строк */
    }
    .error { color: #c0392b; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🗺️ Travel Assistant — планировщик путешествий</h1>

  <div class="form-group">
    <label for="user-message">Твой запрос (город, дни, что хочется увидеть и т.п.)</label>
    <textarea id="user-message" rows="4" placeholder="Например: маршрут в Казань на 3 дня, хочу музеи и парки, без долгих переездов"></textarea>
  </div>

  <div class="form-group">
    <label for="origin-city">Город отправления</label>
    <input type="text" id="origin-city" value="Москва" placeholder="Москва, Санкт-Петербург..." />
  </div>

  <div class="form-group">
    <label for="budget-amount">Бюджет (руб., ориентировочно)</label>
    <input type="number" id="budget-amount" value="30000" placeholder="30000" />
  </div>

  <div class="form-group">
    <label for="participants-count">Количество участников</label>
    <input type="number" id="participants-count" value="2" min="1" max="20" />
  </div>

  <button onclick="sendMessage()">Получить маршрут</button>

  <div id="assistant-response"></div>

  <script>
    const API_URL = '/chat';

    async function sendMessage() {
      const messageEl = document.getElementById('user-message');
      const originEl = document.getElementById('origin-city');
      const budgetEl = document.getElementById('budget-amount');
      const participantsEl = document.getElementById('participants-count');
      const responseEl = document.getElementById('assistant-response');

      const userMessage = messageEl.value.trim();
      if (!userMessage) {
        responseEl.className = 'error';
        responseEl.textContent = 'Пожалуйста, напишите запрос в первом поле.';
        return;
      }

      responseEl.className = '';
      responseEl.textContent = 'Думаю над маршрутом...';

      try {
        const payload = {
          user_message: userMessage,
          origin_city: originEl.value.trim() || 'Москва',
          budget_amount: parseFloat(budgetEl.value) || 30000,
          participants_count: parseInt(participantsEl.value, 10) || 2
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.detail || `Ошибка HTTP: ${res.status}`);
        }

        const data = await res.json();
        responseEl.textContent = data.response;
      } catch (error) {
        console.error(error);
        responseEl.className = 'error';
        responseEl.textContent = 'Ошибка: ' + error.message;
      }
    }
  </script>
</body>
</html>
